<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Spark · LLM Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="logo">▦</span>
      DGX Spark <small>· LLM Runner</small>
    </div>
    <span class="live" id="livePill"><i></i> <span id="liveText">connecting…</span></span>
    <span class="nav">
      <button id="navDash" class="active">Dashboard</button>
      <button id="navServers">Logs</button>
    </span>
    <span class="spacer"></span>
    <button class="btn theme-toggle" id="themeToggle" title="Toggle light / dark">◐</button>
  </header>

  <!-- ==================== DASHBOARD VIEW ==================== -->
  <main id="viewDash">

    <section class="card llm">
      <div class="side">
        <div class="model-title select" id="modelSelect">
          <span class="dot" id="selDot"></span>
          <span id="selName">—</span>
          <span class="tag" id="selTag"></span>
          <button class="btn change" id="btnChangeModel" hidden>Change</button>
          <div class="menu" role="listbox" id="modelMenu">
            <div class="group">Available models</div>
          </div>
        </div>
        <div class="actions">
          <span class="status stopped" id="statusPill"><i></i> <span id="statusText">—</span></span>
          <button class="btn primary" id="btnStart" hidden>Start</button>
          <button class="btn danger-ghost" id="btnStop" hidden>Stop</button>
          <button class="btn" id="btnReload" hidden>Reload</button>
        </div>
      </div>
      <div class="throughput">
        <div class="t">
          <div class="label">Prefill</div>
          <div class="value" id="prefillVal">n/a<small>tok/s</small></div>
          <div class="delta" id="prefillDelta"></div>
        </div>
        <div class="t">
          <div class="label">Decode</div>
          <div class="value" id="decodeVal">n/a<small>tok/s</small></div>
          <div class="delta" id="decodeDelta"></div>
        </div>
      </div>
      <div class="chart">
        <div class="legend">
          <span><span class="sw decode"></span><b>decode</b> tok/s</span>
          <span><span class="sw prefill"></span><b>prefill</b> tok/s</span>
          <span class="spacer"></span>
          <span>last 5 min</span>
        </div>
        <svg id="heroSvg" viewBox="0 0 700 150" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gDec" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/>
              <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g stroke="var(--border)" stroke-width="1">
            <line x1="0" y1="37"  x2="700" y2="37"/>
            <line x1="0" y1="74"  x2="700" y2="74"/>
            <line x1="0" y1="111" x2="700" y2="111"/>
          </g>
        </svg>
      </div>
    </section>

    <div class="row" id="rowSys"></div>
    <div class="row" id="rowGpu"></div>
    <div class="row row-3" id="rowStorage"></div>

  </main>

  <!-- ==================== LOGS VIEW ==================== -->
  <main id="viewServers" hidden>
    <section class="card servers">
      <div class="bar">
        <span class="spacer"></span>
        <label class="ctl">Lines
          <select id="logTail">
            <option>10</option>
            <option selected>20</option>
            <option>50</option>
            <option>100</option>
          </select>
        </label>
        <label class="ctl"><input type="checkbox" id="logAuto" checked> Auto refresh 5s</label>
        <button class="btn" id="logRefresh">Refresh</button>
      </div>
      <div class="detail" id="srvDetail">No model is running</div>
    </section>
    <section class="card logsbox">
      <div class="head"><span class="label">Container logs</span><span class="sub" id="logsMeta"></span></div>
      <pre class="logs" id="logs">No model is running</pre>
    </section>
  </main>

  <footer>
    <span id="footInfo">DGX Spark · single-model mode · sampling every 1s</span>
    <a href="#" id="footLink">LLM servers &amp; logs ↗</a>
  </footer>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
